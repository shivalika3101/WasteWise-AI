server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /auth {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /users {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /predictions {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
