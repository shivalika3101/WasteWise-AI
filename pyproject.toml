[project]
name = "teamb-ml"
version = "0.1.0"
description = "Waste classification inference package"
requires-python = ">=3.12,!=3.14.1,<4.0"
dependencies = [
    "keras==3.15.0",
    "numpy>=2.5.1,<3.0.0",
    "pillow>=12.3.0,<13.0.0",
    "torch>=2.13.0,<3.0.0",
    "torchvision>=0.28.0,<0.29.0",
]


[tool.poetry]
packages = [{include = "ml"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
